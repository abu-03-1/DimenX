<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Magic Converter - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --light: #f8fafc;
            --dark: #1e293b;
            --darker: #0f172a;
            --gray: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--darker), var(--dark));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .shape {
            position: absolute;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.2);
        }

        .shape:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 15%;
            left: 10%;
            animation-delay: 0s;
            background: linear-gradient(135deg, var(--primary), var(--accent));
        }

        .shape:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 65%;
            left: 80%;
            animation-delay: 1.5s;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
        }

        .shape:nth-child(3) {
            width: 80px;
            height: 80px;
            top: 80%;
            left: 15%;
            animation-delay: 3s;
            background: linear-gradient(135deg, var(--accent), var(--secondary));
        }

        .shape:nth-child(4) {
            width: 120px;
            height: 120px;
            top: 20%;
            left: 85%;
            animation-delay: 4.5s;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg) scale(1);
                border-radius: 50%;
            }
            33% { 
                transform: translateY(-30px) rotate(120deg) scale(1.1);
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            }
            66% { 
                transform: translateY(20px) rotate(240deg) scale(0.9);
                border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%;
            }
        }

        .login-container {
            background: var(--card-bg);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.35);
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .logo-icon {
            font-size: 3rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            color: var(--gray);
            margin-bottom: 35px;
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--dark);
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-container {
            position: relative;
        }

        input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(248, 250, 252, 0.8);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            background: white;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        input:focus + .input-icon {
            color: var(--primary);
        }

        .login-btn {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.5);
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            transition: all 0.5s ease;
            opacity: 0;
        }

        .login-btn:hover::after {
            animation: shine 1.5s ease;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); opacity: 0; }
        }

        .demo-accounts {
            margin-top: 30px;
            padding: 20px;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 12px;
            text-align: left;
            border: 1px solid rgba(99, 102, 241, 0.1);
        }

        .demo-title {
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
        }

        .demo-account {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
        }

        .demo-account:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .account-role {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        .account-credentials {
            color: var(--gray);
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.03);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .error-message {
            background: var(--error);
            color: white;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 25px;
            animation: shake 0.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .feature {
            background: rgba(99, 102, 241, 0.05);
            padding: 12px 10px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .feature:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        .feature i {
            color: var(--primary);
            font-size: 14px;
        }

        .footer-text {
            margin-top: 25px;
            color: var(--gray);
            font-size: 13px;
            opacity: 0.8;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .login-container {
                padding: 40px 25px;
            }
            
            .logo-text {
                font-size: 1.8rem;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
            
            .demo-account {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="login-container">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-cube"></i></div>
            <div class="logo-text">3D Magic Studio</div>
        </div>
        <div class="tagline">Transform your 2D images into stunning 3D masterpieces with AI-powered technology</div>
        
        {% if error %}
        <div class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <div class="input-container">
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    <span class="input-icon"><i class="fas fa-user"></i></span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <div class="input-container">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <span class="input-icon"><i class="fas fa-lock"></i></span>
                </div>
            </div>
            
            <button type="submit" class="login-btn">
                <i class="fas fa-rocket"></i>
                Launch 3D Studio
            </button>
        </form>

        

        <div class="features">
            <div class="feature"><i class="fas fa-gem"></i> Ultra Quality 3D</div>
            <div class="feature"><i class="fas fa-bolt"></i> Fast Processing</div>
            <div class="feature"><i class="fas fa-palette"></i> Professional Textures</div>
            <div class="feature"><i class="fas fa-download"></i> Easy Download</div>
        </div>

        <div class="footer-text">
            &copy; 2023 3D Magic Studio | Powered by Advanced AI
        </div>
    </div>

    <script>
        // Add interactive effects
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input');
            
            inputs.forEach(input => {
                // Add focus effect
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('focused');
                });
                
                input.addEventListener('blur', function() {
                    if (this.value === '') {
                        this.parentElement.classList.remove('focused');
                    }
                });
                
                // Add input validation styling
                input.addEventListener('input', function() {
                    if (this.value.length > 0) {
                        this.style.borderColor = 'var(--success)';
                    } else {
                        this.style.borderColor = '#e2e8f0';
                    }
                });
            });
            
            // Add button press effect
            const loginBtn = document.querySelector('.login-btn');
            
            loginBtn.addEventListener('mousedown', function() {
                this.style.transform = 'translateY(0)';
            });
            
            loginBtn.addEventListener('mouseup', function() {
                this.style.transform = 'translateY(-3px)';
            });
        });
    </script>
</body>
</html>
